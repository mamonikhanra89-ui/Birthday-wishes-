<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>

<style>
body{
    margin:0;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#ff6ec4,#7873f5);
    text-align:center;
    color:white;
}

h1{
    margin-top:30px;
    font-size:3em;
    animation:glow 1.5s infinite alternate;
}

@keyframes glow{
    from{transform:scale(1);}
    to{transform:scale(1.08);}
}

.message{
    font-size:1.3em;
    margin:10px;
}

.cake{
    font-size:120px;
    margin-top:20px;
    animation:bounce 2s infinite;
}

@keyframes bounce{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-15px);}
}

.candle{
    font-size:40px;
    animation:flicker 0.3s infinite alternate;
}

@keyframes flicker{
    from{opacity:1;}
    to{opacity:0.5;}
}

.balloon{
    position:absolute;
    font-size:50px;
    animation:float 8s linear infinite;
}

@keyframes float{
    from{transform:translateY(100vh);}
    to{transform:translateY(-120vh);}
}

.footer{
    position:absolute;
    bottom:20px;
    width:100%;
    font-size:1.1em;
}

button{
    padding:12px 25px;
    font-size:18px;
    border:none;
    border-radius:25px;
    cursor:pointer;
    margin-top:15px;
}
</style>
</head>

<body>

<h1>🎉 HAPPY BIRTHDAY Sangita 🎉</h1>

<div class="candle">🕯️ 🕯️ 🕯️</div>
<div class="cake">🎂</div>

<div class="message">
Happy Birthday Rahul! 🎂<br>
May all your dreams come true and may this year bring you lots of happiness, success, and wonderful memories. 🎉✨
</div>

<button onclick="celebrate()">🎊 Celebrate 🎊</button>

<div class="footer">
🎈 May all your dreams come true! 🎈
</div>

<script>
for(let i=0;i<15;i++){
    let b=document.createElement("div");
    b.className="balloon";
    b.innerHTML=Math.random()>0.5?"🎈":"🎉";
    b.style.left=Math.random()*100+"vw";
    b.style.animationDuration=(5+Math.random()*6)+"s";
    document.body.appendChild(b);
}

function celebrate(){
    alert("🎂 Happy Birthday! Have an amazing year ahead! 🎉");
}
</script>

</body>
  </html>
